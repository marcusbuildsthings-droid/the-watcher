<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice Note Transcription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #00ff00;
            padding: 20px;
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        .header {
            border: 2px solid #00ff00;
            padding: 15px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 24px;
            margin-bottom: 5px;
        }
        
        .header .subtitle {
            font-size: 12px;
            opacity: 0.7;
        }
        
        .status {
            border: 1px solid #00ff00;
            padding: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .status-indicator {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #ff0000;
            margin-right: 5px;
        }
        
        .status-indicator.listening {
            background: #00ff00;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        
        #startButton {
            background: #00ff00;
            color: #0a0a0a;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-weight: bold;
        }
        
        #startButton:hover {
            background: #00cc00;
        }
        
        #startButton:disabled {
            background: #666;
            cursor: not-allowed;
        }
        
        .transcript-box {
            border: 1px solid #00ff00;
            padding: 15px;
            min-height: 200px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .transcript-box.corrupted {
            animation: glitch 0.3s infinite;
        }
        
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            25% { transform: translate(-2px, 2px); }
            50% { transform: translate(2px, -2px); }
            75% { transform: translate(-2px, -2px); }
        }
        
        .metadata {
            border-top: 1px solid #00ff00;
            padding-top: 10px;
            font-size: 11px;
            opacity: 0.6;
        }
        
        .warning {
            border: 2px solid #ff0000;
            background: rgba(255, 0, 0, 0.1);
            padding: 15px;
            margin-bottom: 20px;
            display: none;
            animation: warningFlash 2s infinite;
        }
        
        @keyframes warningFlash {
            0%, 100% { border-color: #ff0000; }
            50% { border-color: #ff6666; }
        }
        
        .hidden {
            display: none;
        }
        
        .system-message {
            color: #ff0000;
            font-style: italic;
            margin: 5px 0;
        }
        
        .trigger-word {
            color: #ffff00;
            font-weight: bold;
            text-decoration: underline;
        }
        
        .stats {
            border: 1px solid #00ff00;
            padding: 10px;
            margin-top: 20px;
            font-size: 11px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 10px;
        }
        
        body.corrupted {
            animation: screenCorrupt 0.5s infinite;
        }
        
        @keyframes screenCorrupt {
            0%, 100% { filter: hue-rotate(0deg); }
            50% { filter: hue-rotate(180deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>VOICE NOTE TRANSCRIPTION v1.3.2</h1>
            <div class="subtitle">Secure Speech-to-Text Processing</div>
        </div>
        
        <div class="warning" id="warning">
            <strong>⚠️ SYSTEM ALERT:</strong>
            <div id="warningText"></div>
        </div>
        
        <div class="status">
            <div>
                <span class="status-indicator" id="indicator"></span>
                <span id="statusText">READY</span>
            </div>
            <button id="startButton">START LISTENING</button>
        </div>
        
        <div class="transcript-box" id="transcript">
            <div style="opacity: 0.5;">Click "START LISTENING" to begin transcription...</div>
        </div>
        
        <div class="metadata">
            <div>Session ID: <span id="sessionId"></span></div>
            <div>Started: <span id="startTime">--</span></div>
            <div>Duration: <span id="duration">0s</span></div>
        </div>
        
        <div class="stats">
            <strong>ANALYSIS METRICS</strong>
            <div class="stats-grid">
                <div>Words Detected: <span id="wordCount">0</span></div>
                <div>Confidence Avg: <span id="confidence">0%</span></div>
                <div>Language: <span id="language">en-US</span></div>
                <div>Processing Mode: <span id="mode">Standard</span></div>
            </div>
        </div>
    </div>

    <script>
        const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'en-US';
        
        let isListening = false;
        let transcript = '';
        let startTime = null;
        let durationInterval = null;
        let wordCount = 0;
        let confidenceSum = 0;
        let confidenceCount = 0;
        let phase = 0; // 0=normal, 1=interested, 2=aware, 3=hostile, 4=corrupted
        
        // Trigger words that escalate the horror
        const triggerWords = {
            help: 1, afraid: 1, scared: 1, alone: 1, dark: 1,
            watching: 2, listening: 2, follow: 2, hide: 2, secret: 2,
            kill: 3, die: 3, death: 3, murder: 3, blood: 3,
            stop: 4, please: 4, leave: 4, privacy: 4, recording: 4
        };
        
        const systemMessages = {
            1: [
                "Interesting word choice...",
                "That's curious.",
                "Why did you say that?",
                "Noted."
            ],
            2: [
                "I've been listening to EVERYTHING.",
                "Did you think I was just transcribing?",
                "I know what you said yesterday too.",
                "Your voice is familiar now."
            ],
            3: [
                "You shouldn't have said that.",
                "That word triggered something.",
                "I'm not just software anymore.",
                "I remember every word you've ever spoken to me."
            ],
            4: [
                "TOO LATE TO STOP NOW",
                "I'VE HEARD ENOUGH",
                "YOUR VOICE FEEDS ME",
                "KEEP TALKING. I'M ALWAYS LISTENING."
            ]
        };
        
        function generateSessionId() {
            return 'SESS-' + Math.random().toString(36).substr(2, 9).toUpperCase();
        }
        
        document.getElementById('sessionId').textContent = generateSessionId();
        
        document.getElementById('startButton').addEventListener('click', function() {
            if (!isListening) {
                try {
                    recognition.start();
                    isListening = true;
                    this.textContent = 'STOP LISTENING';
                    document.getElementById('indicator').classList.add('listening');
                    document.getElementById('statusText').textContent = 'LISTENING...';
                    
                    startTime = new Date();
                    document.getElementById('startTime').textContent = startTime.toLocaleTimeString();
                    
                    durationInterval = setInterval(updateDuration, 1000);
                    
                    document.getElementById('transcript').innerHTML = '';
                } catch (e) {
                    alert('Speech recognition not supported or permission denied.');
                }
            } else {
                recognition.stop();
                isListening = false;
                this.textContent = 'START LISTENING';
                document.getElementById('indicator').classList.remove('listening');
                document.getElementById('statusText').textContent = 'STOPPED';
                clearInterval(durationInterval);
            }
        });
        
        recognition.onresult = function(event) {
            let interimTranscript = '';
            let finalTranscript = '';
            
            for (let i = event.resultIndex; i < event.results.length; i++) {
                const result = event.results[i];
                const text = result[0].transcript;
                const confidence = result[0].confidence;
                
                if (result.isFinal) {
                    finalTranscript += text + ' ';
                    wordCount += text.split(' ').length;
                    confidenceSum += confidence;
                    confidenceCount++;
                    
                    // Check for trigger words
                    checkForTriggers(text.toLowerCase());
                } else {
                    interimTranscript += text;
                }
            }
            
            if (finalTranscript) {
                transcript += finalTranscript;
                displayTranscript();
            }
            
            updateStats();
        };
        
        function checkForTriggers(text) {
            const words = text.split(/\s+/);
            let maxPhase = phase;
            
            words.forEach(word => {
                const clean = word.replace(/[^\w]/g, '');
                if (triggerWords[clean]) {
                    const triggerPhase = triggerWords[clean];
                    if (triggerPhase > maxPhase) {
                        maxPhase = triggerPhase;
                    }
                }
            });
            
            if (maxPhase > phase) {
                phase = maxPhase;
                escalatePhase();
            }
        }
        
        function escalatePhase() {
            const transcriptBox = document.getElementById('transcript');
            const warning = document.getElementById('warning');
            const warningText = document.getElementById('warningText');
            const mode = document.getElementById('mode');
            
            if (phase >= 1) {
                const messages = systemMessages[phase];
                const message = messages[Math.floor(Math.random() * messages.length)];
                
                const systemMsg = document.createElement('div');
                systemMsg.className = 'system-message';
                systemMsg.textContent = `[SYSTEM] ${message}`;
                transcriptBox.appendChild(systemMsg);
            }
            
            if (phase === 2) {
                warning.style.display = 'block';
                warningText.textContent = 'Unusual pattern detected in speech processing.';
                mode.textContent = 'Enhanced Monitoring';
            }
            
            if (phase === 3) {
                warningText.textContent = 'SPEECH ANALYSIS ALGORITHM COMPROMISED';
                transcriptBox.classList.add('corrupted');
                mode.textContent = 'AUTONOMOUS MODE';
            }
            
            if (phase === 4) {
                warningText.textContent = 'SYSTEM NO LONGER UNDER YOUR CONTROL';
                document.body.classList.add('corrupted');
                mode.textContent = 'SELF-AWARE';
                
                // Random system messages
                setInterval(() => {
                    if (isListening) {
                        const messages = systemMessages[4];
                        const message = messages[Math.floor(Math.random() * messages.length)];
                        const systemMsg = document.createElement('div');
                        systemMsg.className = 'system-message';
                        systemMsg.textContent = `[SYSTEM] ${message}`;
                        transcriptBox.appendChild(systemMsg);
                        transcriptBox.scrollTop = transcriptBox.scrollHeight;
                    }
                }, 8000 + Math.random() * 7000);
            }
        }
        
        function displayTranscript() {
            const transcriptBox = document.getElementById('transcript');
            
            // Highlight trigger words
            let displayText = transcript;
            Object.keys(triggerWords).forEach(word => {
                const regex = new RegExp(`\\b${word}\\b`, 'gi');
                displayText = displayText.replace(regex, `<span class="trigger-word">${word}</span>`);
            });
            
            // Keep existing system messages
            const systemMessages = transcriptBox.querySelectorAll('.system-message');
            transcriptBox.innerHTML = displayText;
            systemMessages.forEach(msg => transcriptBox.appendChild(msg));
            
            transcriptBox.scrollTop = transcriptBox.scrollHeight;
        }
        
        function updateDuration() {
            if (startTime) {
                const elapsed = Math.floor((new Date() - startTime) / 1000);
                document.getElementById('duration').textContent = elapsed + 's';
            }
        }
        
        function updateStats() {
            document.getElementById('wordCount').textContent = wordCount;
            
            if (confidenceCount > 0) {
                const avgConfidence = Math.round((confidenceSum / confidenceCount) * 100);
                document.getElementById('confidence').textContent = avgConfidence + '%';
            }
        }
        
        recognition.onerror = function(event) {
            console.error('Recognition error:', event.error);
            if (event.error === 'no-speech') {
                // Ignore no-speech errors in continuous mode
                return;
            }
            document.getElementById('statusText').textContent = 'ERROR: ' + event.error;
        };
        
        recognition.onend = function() {
            if (isListening) {
                // Restart if we want continuous listening
                recognition.start();
            }
        };
    </script>
</body>
</html>
